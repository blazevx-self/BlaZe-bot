      Бесплатный кофе не дают просто так бездарям вроде тебя.
    
      🫰🏼 Сломай ещё - <b>{needed} пальцев</b>, чтобы насладиться чашечкой ароматного кофе в «Антейку».

    overdose_1: |
      <b>Ты словил передоз ✌️</b>
    
      Тебе же русским языков советовали: <b>жди 30 минут</b>.
      Но ты, видимо, слишком особенный, чтобы слушать?
    
      Отдыхай теперь <b>5 часов</b>, убежище.
