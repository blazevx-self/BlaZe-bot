      ⚠️ <b>Состояние: передоз</b>
    
      Ты выпил слишком много кофе и валяешься на полу кафе.
    
      <tg-emoji emoji-id="5258258882022612173">⏲️</tg-emoji> Очнёшься через: <b>{time}</b>

